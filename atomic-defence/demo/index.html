<style>
  :root {
    --paper:  #F2E7D3;
    --ink:    #21303A;
    --red:    #DE3B26;
    --teal:   #2E8C85;
    --gold:   #E3A23C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* Read back into JS so the HUD clears notches and gesture bars. */
    --safe-top:    env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left:   env(safe-area-inset-left, 0px);
    --safe-right:  env(safe-area-inset-right, 0px);
  }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    background: var(--paper);
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  /* Halftone + grain overlays, purely decorative */
  #halftone {
    position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle, rgba(33,48,58,0.10) 1px, transparent 1.4px);
    background-size: 7px 7px;
    mix-blend-mode: multiply;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(33,48,58,0.22) 100%);
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="halftone"></div>
<div id="vignette"></div>
<script>
'use strict';
window.ATOMIC_DEMO = true;   /* injected by tools/build-demo.py */
/* =====================================================================
   ATOMIC DEFENCE — a mid-century Missile Command reimagining.
   Tap or click to launch a flak burst. Intercept the warheads.
   Chain detonations multiply your score. Defend the six cities.
   ===================================================================== */

const PALETTE = {
  paper: '#F2E7D3',
  paperDark: '#E7D9BF',
  ink:   '#21303A',
  red:   '#DE3B26',
  redDark: '#B32A1B',
  teal:  '#2E8C85',
  tealDark: '#1F6660',
  gold:  '#E3A23C',
  cream: '#FBF4E4'
};

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1, groundY = 0;
let SAFE = { top: 0, bottom: 0, left: 0, right: 0 };

function readSafeArea() {
  const cs = getComputedStyle(document.documentElement);
  const px = (name) => parseFloat(cs.getPropertyValue(name)) || 0;
  SAFE = {
    top: px('--safe-top'), bottom: px('--safe-bottom'),
    left: px('--safe-left'), right: px('--safe-right')
  };
}

function resize() {
  readSafeArea();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  groundY = H - Math.max(52, H * 0.085) - SAFE.bottom;
  layoutCities();
}
window.addEventListener('resize', resize);

/* ------------------------------------------------------------------ */
/* Audio: tiny WebAudio synth, created lazily on first interaction.   */
/* ------------------------------------------------------------------ */
let AC = null;
function audio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function blip(freq, dur, type, vol, slide) {
  if (!settings.sound) return;
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function boom(vol, dur) {
  if (!settings.sound) return;
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const len = Math.floor(ac.sampleRate * (dur || 0.4));
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(900, t);
  f.frequency.exponentialRampToValueAtTime(120, t + (dur || 0.4));
  const g = ac.createGain();
  g.gain.setValueAtTime(vol || 0.25, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.4));
  src.connect(f).connect(g).connect(ac.destination);
  src.start(t);
}
const SFX = {
  fire:     () => blip(660, 0.18, 'square', 0.05, 0.35),
  dry:      () => blip(140, 0.10, 'sawtooth', 0.05, 0.8),
  burst:    () => { boom(0.18, 0.35); blip(220, 0.25, 'triangle', 0.05, 0.4); },
  chain:    (n) => blip(520 + n * 130, 0.22, 'triangle', 0.07, 1.4),
  cityHit:  () => { boom(0.4, 0.8); blip(90, 0.6, 'sawtooth', 0.08, 0.5); },
  waveDone: () => { blip(523, 0.12, 'square', 0.06); setTimeout(() => blip(659, 0.12, 'square', 0.06), 110); setTimeout(() => blip(784, 0.2, 'square', 0.06), 220); },
  gameOver: () => { blip(392, 0.3, 'square', 0.07, 0.5); setTimeout(() => boom(0.35, 1.1), 150); }
};

/* ------------------------------------------------------------------ */
/* Game state                                                         */
/* ------------------------------------------------------------------ */
const MODE = { MENU: 0, PLAYING: 1, WAVE_END: 2, GAME_OVER: 3, PAUSED: 4, HOWTO: 5,
               ENTRY: 6, SCORES: 7, VICTORY: 8, DEMO_END: 9 };
let mode = MODE.MENU;

const FINAL_WAVE = 100;

/* Web demo. Off in the shipped app; the site build injects
   window.ATOMIC_DEMO = true so one file remains the single source of truth.
   The demo stops dead after a single wave. */
const DEMO = !!window.ATOMIC_DEMO;
const DEMO_WAVES = 1;

/* ------------------------------------------------------------------ */
/* Difficulty                                                         */
/*                                                                    */
/* Chosen on the menu, locked for the run. Score multipliers keep the  */
/* one high score table honest: an easy run cannot out-rank a hard one */
/* on raw survival alone.                                              */
/* ------------------------------------------------------------------ */
const DIFFICULTIES = [
  { id: 'easy',   name: 'EASY',   short: 'E', count: 0.70, speed: 0.82,
    ammo: 1.35, gap: 1.25, pick: 6.0, score: 0.6, col: PALETTE.teal },
  { id: 'medium', name: 'MEDIUM', short: 'M', count: 1.00, speed: 1.00,
    ammo: 1.00, gap: 1.00, pick: 4.0, score: 1.0, col: PALETTE.tealDark },
  { id: 'hard',   name: 'HARD',   short: 'H', count: 1.25, speed: 1.12,
    ammo: 0.85, gap: 0.85, pick: 3.0, score: 1.6, col: PALETTE.gold },
  { id: 'expert', name: 'EXPERT', short: 'X', count: 1.55, speed: 1.26,
    ammo: 0.70, gap: 0.72, pick: 2.5, score: 2.5, col: PALETTE.red }
];
const DIFF_BY_ID = {};
DIFFICULTIES.forEach(d => { DIFF_BY_ID[d.id] = d; });

let difficulty = 'medium';      // locked in at the start of a run
function diff() { return DIFF_BY_ID[difficulty] || DIFFICULTIES[1]; }

/* ------------------------------------------------------------------ */
/* Difficulty curve                                                   */
/*                                                                    */
/* Tuned for a hundred waves rather than a dozen. Counts and speeds    */
/* rise steeply early then flatten, because a linear ramp would put    */
/* 300 warheads on wave 100. Past the halfway point the pressure comes */
/* from WHAT is falling, not how much of it — see threatWeights().     */
/* ------------------------------------------------------------------ */
function waveConfig(w) {
  const D = diff();
  return {
    count:    Math.max(4, Math.round((6 + 42 * (1 - Math.exp(-w / 20))) * D.count)),
    // Floor scales too, or every mode would converge on the same cadence late.
    interval: Math.max(0.22 * D.gap, 1.35 * Math.exp(-w / 26) * D.gap),
    speed:    (26 + 80 * (1 - Math.exp(-w / 30))) * D.speed,
    mirv:     w >= 3 ? Math.min(0.42, 0.06 + w * 0.012) * D.count : 0
  };
}

const HS_KEY = 'atomic-defence.highScore';
function loadHighScore() {
  try { return Math.max(0, parseInt(localStorage.getItem(HS_KEY), 10) || 0); }
  catch (e) { return 0; }
}
function saveHighScore(v) {
  try { localStorage.setItem(HS_KEY, String(v)); } catch (e) { /* private mode etc. */ }
}

const SET_KEY = 'atomic-defence.settings';
const settings = { sound: true, haptics: true, difficulty: 'medium' };
try { Object.assign(settings, JSON.parse(localStorage.getItem(SET_KEY)) || {}); }
catch (e) { /* defaults stand */ }
function saveSettings() {
  try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch (e) {}
}
/* ------------------------------------------------------------------ */
/* Haptics                                                            */
/*                                                                    */
/* One motor cannot shake a corner of the phone. But a crisp, short    */
/* pulse is *referred* by the brain to whatever the finger is touching,*/
/* so player actions use sharp effects (felt at the fingertip) and     */
/* distant events use broad rumbles. Intensity also falls off with     */
/* distance from the last tap, so nearby kills read as "mine".         */
/* ------------------------------------------------------------------ */
const nativeHaptics = (window.Capacitor && window.Capacitor.Plugins &&
                       window.Capacitor.Plugins.AtomicHaptics) || null;
// Web fallback: the Vibration API has no amplitude, so only duration varies.
const HAPTIC_FALLBACK = {
  launch:      12,
  dry:      [6, 40, 6],
  hit:      24,
  armour:   [14, 26, 18],
  city:     110,
  gameover: [60, 40, 120],
  wave:     [10, 80, 10, 80, 20],
  ui:       6
};
/* Coalescing.
   A single blast can kill six warheads in one frame, and each kill used to
   dispatch its own vibration. Because a new vibrate() cancels the one playing,
   the motor never completed an effect and the result was continuous mush —
   which is why every effect "felt like vibration" no matter how it was built.
   Frequent effects are now collected per frame and only the most significant
   one is played, so the motor gets to finish what it starts. */
const HAPTIC_PRIORITY = { hit: 1, armour: 2, dry: 2, city: 4, gameover: 5 };
let pendingHaptic = null;

function haptic(effect, scale, ms) {
  if (!settings.haptics) return;
  const pri = HAPTIC_PRIORITY[effect];
  if (pri !== undefined) {
    const s = scale === undefined ? 1 : scale;
    if (!pendingHaptic || pri > pendingHaptic.pri ||
        (pri === pendingHaptic.pri && s > pendingHaptic.scale)) {
      pendingHaptic = { effect, scale: s, ms, pri };
    }
    return;
  }
  dispatchHaptic(effect, scale, ms);
}

// Called once per frame, after all collisions have resolved.
function flushHaptics() {
  if (!pendingHaptic) return;
  dispatchHaptic(pendingHaptic.effect, pendingHaptic.scale, pendingHaptic.ms);
  pendingHaptic = null;
}

function dispatchHaptic(effect, scale, ms) {
  if (nativeHaptics) {
    nativeHaptics.play({
      effect,
      scale: scale === undefined ? 1 : scale,
      ms: Math.round(ms === undefined ? 500 : ms)
    }).catch(() => {});
    return;
  }
  if (!navigator.vibrate) return;
  if (effect === 'launchTrail') {
    // The web has no amplitude control, so the pulses-over-a-floor envelope
    // cannot be expressed at all. One held buzz is the nearest thing.
    navigator.vibrate(Math.max(80, Math.min(900, Math.round(ms || 400))));
    return;
  }
  const f = HAPTIC_FALLBACK[effect];
  if (f === null || f === undefined) return;
  // Duration is the only lever on the web, so lean on it for intensity.
  navigator.vibrate(typeof f === 'number' && scale !== undefined
    ? Math.max(4, Math.round(f * (0.5 + scale)))
    : f);
}

// Kill any in-flight trail ticks, e.g. when the game is paused mid-shot.
function hapticStop() {
  pendingHaptic = null;
  if (nativeHaptics && nativeHaptics.stop) nativeHaptics.stop().catch(() => {});
  else if (navigator.vibrate) navigator.vibrate(0);
}

// Where the player last touched: the anchor for haptic referral.
let lastTapX = null, lastTapY = null;
function proximity(x, y) {
  if (lastTapX === null) return 0.5;
  const reach = Math.max(160, H * 0.45);
  return Math.max(0, 1 - Math.hypot(x - lastTapX, y - lastTapY) / reach);
}

let score = 0, highScore = loadHighScore(), wave = 0;
let shots = 0, kills = 0, bestChain = 1;

/* High score table: local top 10, arcade three-initial entries. */
const TABLE_KEY = 'atomic-defence.table';
const TABLE_MAX = 10;
function loadTable() {
  try { return JSON.parse(localStorage.getItem(TABLE_KEY)) || []; }
  catch (e) { return []; }
}
function saveTable(t) {
  try { localStorage.setItem(TABLE_KEY, JSON.stringify(t)); } catch (e) {}
}
let scoreTable = loadTable();
let entryName = '', entryIdx = -1;
function qualifies(s) {
  return s > 0 &&
         (scoreTable.length < TABLE_MAX || s > scoreTable[scoreTable.length - 1].s);
}
function commitEntry() {
  const rec = { n: entryName || '???', s: score, w: wave, d: difficulty };
  scoreTable.push(rec);
  scoreTable.sort((a, b) => b.s - a.s);
  scoreTable = scoreTable.slice(0, TABLE_MAX);
  entryIdx = scoreTable.indexOf(rec);
  saveTable(scoreTable);
  SFX.waveDone();
  mode = MODE.SCORES;
}
let ammo = 0, ammoMax = 0;
let missiles = [], interceptors = [], explosions = [], particles = [], floaters = [];
let bombers = [];
let buried = [];
let cities = [];
let spawnQueue = 0, spawnTimer = 0, spawnInterval = 1.2;
let waveSpeed = 33, waveMirv = 0;
let bomberQueue = 0, bomberTimer = 0;
let shake = 0, flash = 0, slowMo = 1;
let waveEndTimer = 0, waveBonus = null;
let titlePulse = 0;

function layoutCities() {
  // Six cities, three either side of the central battery.
  const margin = W * 0.06;
  const usable = W - margin * 2;
  const slots = [0, 1, 2, 4, 5, 6]; // slot 3 is the battery
  const newCities = slots.map((s, i) => {
    const x = margin + (usable / 7) * s + usable / 14;
    const prev = cities[i];
    return {
      x, alive: prev ? prev.alive : true,
      seed: prev ? prev.seed : Math.random() * 1000,
      smoke: prev ? prev.smoke : 0
    };
  });
  cities = newCities;
}

function batteryX() { return W / 2; }

function resetGame() {
  // Locked for the whole run, so the menu cannot be used to soften a bad wave.
  difficulty = DIFF_BY_ID[settings.difficulty] ? settings.difficulty : 'medium';
  score = 0; wave = 0;
  shots = 0; kills = 0; bestChain = 1;
  launcher = 'flak'; pickTimer = 0; shotsThisWave = 0;
  missiles = []; interceptors = []; explosions = []; particles = []; floaters = [];
  bombers = [];
  cities.forEach(c => { c.alive = true; c.smoke = 0; });
  startWave();
  mode = MODE.PLAYING;
  announce('INCOMING WARHEADS DETECTED');
}

function announce(text) {
  floaters.push({ x: W / 2, y: H * 0.3, text, col: PALETTE.red, t: 0, life: 2.4, big: true });
  blip(392, 0.14, 'square', 0.06);
  setTimeout(() => blip(311, 0.22, 'square', 0.06), 140);
}

const THREAT_NAME = {
  mirv: 'MIRV SPLITTERS', bomber: 'BOMBER PATROLS', smart: 'DODGERS',
  heavy: 'ARMOURED HEAVIES', hunter: 'INTERCEPTOR HUNTERS',
  shielded: 'SHIELDED WARHEADS', phantom: 'PHANTOMS',
  carrier: 'CARRIER AIRSHIPS', burrower: 'BURROWERS'
};

function startWave() {
  wave++;
  const cfg = waveConfig(wave);
  waveSpeed = cfg.speed;
  waveMirv = cfg.mirv;
  missiles = []; interceptors = []; explosions = []; bombers = []; buried = [];
  spawnQueue = cfg.count;
  spawnInterval = cfg.interval;
  spawnTimer = 0.8;
  bomberQueue = wave >= THREAT_INTRO.bomber
    ? Math.min(5, 1 + Math.floor((wave - THREAT_INTRO.bomber) / 6)) : 0;
  bomberTimer = 3 + Math.random() * 3;
  ammoMax = baseAmmo(cfg);
  ammo = ammoMax;
  shotsThisWave = 0;
  // The clock is already running, and it runs faster the harder you play.
  pickTimer = unlockedLaunchers().length > 1 ? diff().pick : 0;
  waveBonus = null;
  for (const key in THREAT_INTRO) {
    if (THREAT_INTRO[key] === wave) announce('NEW THREAT: ' + THREAT_NAME[key]);
  }
}

/* ------------------------------------------------------------------ */
/* Entities                                                           */
/* ------------------------------------------------------------------ */
/* Threat roster:
   std      — the classic warhead. May carry MIRV from wave 3.
   smart    — the dodger: fast, swerves away from friendly blasts.
   heavy    — armoured: slow, takes two hits, sheds its plating on the first.
   hunter   — turns on your interceptors and kills them in flight.
   shielded — a rotating plate plugs one arc; hit it from the open side.
   phantom  — flickers out of sight, revealed by nearby blast light.
   burrower — does not detonate on landing; digs in, then takes the city.
   Bombers and carriers fly horizontally and are separate entities. */
const THREAT_INTRO = {
  mirv: 3, bomber: 4, smart: 5, heavy: 6,
  hunter: 12, shielded: 18, carrier: 34, phantom: 26, burrower: 42
};
const THREAT_SCORE = {
  std: 100, smart: 150, heavy: 300, bomber: 250,
  hunter: 350, shielded: 400, phantom: 450, burrower: 500, carrier: 800
};

/* ------------------------------------------------------------------ */
/* Launchers                                                          */
/*                                                                    */
/* A new one every tenth wave. At the start of each wave you pick ONE  */
/* and live with it, ammo and all, for the whole wave. The wave does   */
/* not wait: warheads are already falling while you decide.            */
/* Ammo is a multiplier on the wave's base allocation, so the tiny     */
/* magazines belong to the launchers that clear the most per round.    */
/* ------------------------------------------------------------------ */
const LAUNCHERS = [
  { id: 'flak',    name: 'FLAK',    unlock: 0,  ammo: 1.00, col: PALETTE.teal,
    blurb: 'BALANCED BURST' },
  { id: 'scatter', name: 'SCATTER', unlock: 10, ammo: 0.70, col: PALETTE.gold,
    blurb: 'SPLITS INTO THREE' },
  { id: 'lance',   name: 'LANCE',   unlock: 20, ammo: 0.55, col: PALETTE.red,
    blurb: 'SPEARS A WHOLE LINE' },
  { id: 'pulse',   name: 'PULSE',   unlock: 30, ammo: 0.45, col: PALETTE.tealDark,
    blurb: 'STALLS, NEVER KILLS' },
  { id: 'seeker',  name: 'SEEKER',  unlock: 40, ammo: 0.50, col: PALETTE.teal,
    blurb: 'TWO ROUNDS THAT HUNT' },
  { id: 'mortar',  name: 'MORTAR',  unlock: 50, ammo: 0.60, col: PALETTE.gold,
    blurb: 'LOBBED, LINGERING FIRE' },
  { id: 'atom',    name: 'ATOM',    unlock: 60, ammo: 0.15, col: PALETTE.red,
    blurb: 'HUGE — MIND THE CITIES' }
];
const LAUNCHER_BY_ID = {};
LAUNCHERS.forEach(l => { LAUNCHER_BY_ID[l.id] = l; });

let launcher = 'flak';          // chosen for the current wave
let pickTimer = 0;              // seconds left to choose; 0 = choice closed
let shotsThisWave = 0;

function unlockedLaunchers() {
  return LAUNCHERS.filter(l => wave >= l.unlock);
}
function launcherAmmoFactor() {
  const l = LAUNCHER_BY_ID[launcher];
  return l ? l.ammo : 1;
}
function baseAmmo(cfg, l) {
  const factor = l ? l.ammo : launcherAmmoFactor();
  return Math.max(3, Math.round((11 + cfg.count * 0.9) * factor * diff().ammo));
}
function chooseLauncher(id) {
  if (!LAUNCHER_BY_ID[id] || wave < LAUNCHER_BY_ID[id].unlock) return;
  launcher = id;
  // Recompute the magazine for the new weapon, less whatever is already spent,
  // so swapping mid-choice cannot be used to refill.
  ammoMax = baseAmmo(waveConfig(wave));
  ammo = Math.max(0, ammoMax - shotsThisWave);
  pickTimer = 0;
  addFloater(W / 2, H * 0.62, LAUNCHER_BY_ID[id].name + ' ARMED',
             LAUNCHER_BY_ID[id].col, true);
}

/* Each threat is introduced at a wave and then grows as a share of the mix,
   so the late game is a different game rather than simply a busier one.
   Weights are relative, not percentages. */
function threatWeights(w) {
  const ramp = (start, rate, cap) =>
    w >= start ? Math.max(0, Math.min(cap, (w - start) * rate)) : 0;
  return {
    std:      Math.max(8, 46 - w * 0.42),
    smart:    ramp(THREAT_INTRO.smart,    0.85, 18),
    heavy:    ramp(THREAT_INTRO.heavy,    0.75, 17),
    hunter:   ramp(THREAT_INTRO.hunter,   0.70, 15),
    shielded: ramp(THREAT_INTRO.shielded, 0.60, 15),
    phantom:  ramp(THREAT_INTRO.phantom,  0.50, 13),
    burrower: ramp(THREAT_INTRO.burrower, 0.40, 11)
  };
}

function rollThreatType() {
  const ws = threatWeights(wave);
  let total = 0;
  for (const k in ws) total += ws[k];
  let r = Math.random() * total;
  for (const k in ws) { r -= ws[k]; if (r <= 0) return k; }
  return 'std';
}

function spawnMissile(fromX, fromY, mirvDepth, forcedType) {
  const targets = cities.filter(c => c.alive).map(c => c.x);
  targets.push(batteryX());
  const tx = targets.length
    ? targets[Math.floor(Math.random() * targets.length)] + (Math.random() * 40 - 20)
    : Math.random() * W;
  const sx = fromX !== undefined ? fromX : Math.random() * W;
  const sy = fromY !== undefined ? fromY : -12;
  const type = forcedType || (mirvDepth ? 'std' : rollThreatType());
  let speedMul = 1;
  if (type === 'smart')    speedMul = 1.2;
  if (type === 'heavy')    speedMul = 0.55;
  if (type === 'hunter')   speedMul = 1.35;
  if (type === 'shielded') speedMul = 0.7;
  if (type === 'phantom')  speedMul = 1.1;
  if (type === 'burrower') speedMul = 0.8;
  if (mirvDepth) speedMul *= 1.25;
  const speed = (waveSpeed + Math.random() * 18) * speedMul;
  const dx = tx - sx, dy = groundY - sy;
  const len = Math.hypot(dx, dy) || 1;
  return {
    x: sx, y: sy, ox: sx, oy: sy,
    vx: dx / len * speed, vy: dy / len * speed,
    type, hp: type === 'heavy' ? 2 : 1, hitBy: null, stun: 0,
    shieldA: Math.random() * Math.PI * 2,        // shielded: arc that blocks
    shieldSpin: (Math.random() < 0.5 ? -1 : 1) * (0.8 + Math.random() * 0.7),
    ghost: Math.random() * Math.PI * 2,          // phantom: fade cycle
    mirv: type === 'std' && !mirvDepth && Math.random() < waveMirv,
    mirvY: groundY * (0.25 + Math.random() * 0.3),
    depth: mirvDepth || 0
  };
}

function spawnBomber() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  const y = H * (0.14 + Math.random() * 0.16);
  // Carriers are the heavy end of the air wing: slow, tough, relentless.
  const carrier = wave >= THREAT_INTRO.carrier && Math.random() < 0.35;
  bombers.push({
    x: dir === 1 ? -60 : W + 60, y, baseY: y, dir,
    type: carrier ? 'carrier' : 'bomber',
    hp: carrier ? 3 : 1, stun: 0, hitBy: null,
    vx: dir * (carrier ? 26 : 44 + Math.min(60, wave * 2)),
    t: Math.random() * 10,
    drop: carrier ? 0.9 : 1.4 + Math.random()
  });
}

function spawnExplosion(x, y, chain, hostile, opts) {
  opts = opts || {};
  const maxR = opts.maxR || (hostile ? 34 : (chain ? 44 : 58));
  explosions.push({
    x, y, r: 4, maxR,
    phase: 0, t: 0, chain: chain || 0, hostile: !!hostile,
    hold: opts.hold || 0.32,      // mortar fire lingers far longer than flak
    stun: !!opts.stun,            // pulse: stalls threats instead of killing
    col: opts.col || null,
    spokes: 7 + Math.floor(Math.random() * 4),
    rot: Math.random() * Math.PI
  });
  for (let i = 0; i < (hostile ? 10 : 16); i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 140;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
      life: 0.5 + Math.random() * 0.5, t: 0,
      col: hostile ? PALETTE.red : (chain ? PALETTE.gold : PALETTE.teal),
      size: 1.5 + Math.random() * 2.5
    });
  }
  if (hostile) boom(0.14, 0.3);
  else if (chain) SFX.chain(Math.min(chain, 6));
  else SFX.burst();
}

function addScore(n) {
  const gained = Math.round(n * diff().score);
  score += gained;
  return gained;
}

function addFloater(x, y, text, col, big) {
  floaters.push({ x, y, text, col, t: 0, life: 1.1, big: !!big });
}

/* Kill resolution lives here rather than inline in the explosion loop, because
   the lance kills by contact rather than by blast and needs the same rules. */
function killMissile(j, m, chain) {
  missiles.splice(j, 1);
  kills++;
  if (chain > bestChain) bestChain = chain;
  haptic('hit', Math.min(1, 0.3 + 0.4 * proximity(m.x, m.y) +
                            0.3 * Math.min(chain - 1, 3) / 3));
  const pts = addScore(THREAT_SCORE[m.type] * chain);
  addFloater(m.x, m.y - 10, chain > 1 ? `${pts} ×${chain}` : `${pts}`,
             chain > 1 ? PALETTE.gold : PALETTE.teal, chain > 2);
  spawnExplosion(m.x, m.y, chain, false);
  shake = Math.min(10, shake + 1.5 + chain);
}

function killBomber(j, b, chain, src) {
  // One blast, one hit — checked before the hull test, or a lingering blast
  // would strip a gondola and then finish the carrier on the very next frame.
  if (src && b.hitBy === src) return;
  // Carriers shrug off the first hits; each one costs it a gondola.
  if (b.hp > 1) {
    b.hp--; b.hitBy = src || null;
    addScore(80);
    addFloater(b.x, b.y - 14, 'HULL BREACH!', PALETTE.gold, false);
    blip(760, 0.09, 'square', 0.06, 0.6);
    haptic('armour');
    return;
  }
  bombers.splice(j, 1);
  kills++;
  if (chain > bestChain) bestChain = chain;
  haptic('hit', Math.min(1, 0.45 + 0.3 * proximity(b.x, b.y) +
                            0.3 * Math.min(chain - 1, 3) / 3));
  const pts = addScore(THREAT_SCORE[b.type || 'bomber'] * chain);
  addFloater(b.x, b.y - 12, chain > 1 ? `${pts} ×${chain}` : `${pts}`,
             PALETTE.gold, true);
  spawnExplosion(b.x, b.y, chain, false);
  shake = Math.min(12, shake + 3 + chain);
}

/* Returns true if the threat died; false if it only lost armour.
   `src` is whatever dealt the damage, so one blast cannot strike twice. */
function damageMissile(j, m, chain, src, sx, sy) {
  if (m.hitBy === src && src) return false;
  // A shielded warhead plugs one arc; come at it from the open side.
  if (m.type === 'shielded' && sx !== undefined) {
    const toSrc = Math.atan2(sy - m.y, sx - m.x);
    // Wrapped to [0, PI]: zero means the blast came in dead on the plate.
    const diff = Math.abs(((toSrc - m.shieldA + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
    if (diff < 1.0) {
      m.hitBy = src || null;
      addFloater(m.x, m.y - 14, 'BLOCKED', PALETTE.tealDark, false);
      blip(300, 0.08, 'square', 0.05, 1.6);
      return false;
    }
  }
  if (m.type === 'heavy' && m.hp > 1) {
    m.hp--; m.hitBy = src || null;
    addScore(50);
    haptic('armour');
    addFloater(m.x, m.y - 12, 'ARMOUR OFF!', PALETTE.gold, false);
    blip(880, 0.07, 'square', 0.06, 0.6);
    blip(587, 0.1, 'square', 0.05, 0.5);
    for (let k = 0; k < 12; k++) {
      const a = Math.random() * Math.PI * 2, sp = 70 + Math.random() * 110;
      particles.push({
        x: m.x, y: m.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 50,
        life: 0.6 + Math.random() * 0.5, t: 0,
        col: k % 3 === 0 ? PALETTE.gold : PALETTE.ink,
        size: 3 + Math.random() * 2.5
      });
    }
    return false;
  }
  killMissile(j, m, chain);
  return true;
}

/* What each launcher does when its round arrives. */
function detonate(it) {
  const k = it.kind || 'flak';
  if (k === 'scatter') {
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + Math.random();
      spawnExplosion(it.tx + Math.cos(a) * 34, it.ty + Math.sin(a) * 34,
                     0, false, { maxR: 36 });
    }
  } else if (k === 'pulse') {
    spawnExplosion(it.tx, it.ty, 0, false,
                   { maxR: 118, hold: 0.5, stun: true, col: PALETTE.tealDark });
  } else if (k === 'mortar') {
    spawnExplosion(it.x, it.y, 0, false, { maxR: 74, hold: 2.0, col: PALETTE.gold });
  } else if (k === 'atom') {
    spawnExplosion(it.tx, it.ty, 0, false, { maxR: 140, hold: 0.7, col: PALETTE.red });
    shake = Math.min(26, shake + 20);
    flash = 0.6;
    // Your own bomb, your own problem: detonating low levels the cities too.
    if (it.ty > groundY - 120) {
      for (const c of cities) {
        if (c.alive && Math.abs(c.x - it.tx) < 85) {
          addFloater(c.x, groundY - 60, 'TOO LOW!', PALETTE.red, true);
          destroyCity(c);
        }
      }
    }
  } else if (k === 'seeker') {
    spawnExplosion(it.x, it.y, 0, false, { maxR: 34 });
  } else {
    spawnExplosion(it.tx, it.ty, 0, false);
  }
}

function fireInterceptor(tx, ty) {
  if (mode !== MODE.PLAYING) return;
  if (ty > groundY - 20) ty = groundY - 20;
  // The finger is here right now, so this is the anchor for referral.
  lastTapX = tx; lastTapY = ty;
  if (ammo <= 0) { SFX.dry(); haptic('dry'); return; }   // out of flak
  ammo--; shots++; shotsThisWave++;
  const bx = batteryX(), by = groundY - 8;
  const dx = tx - bx, dy = ty - by, len = Math.hypot(dx, dy) || 1;
  let speed = Math.max(H * 0.85, 480);
  if (launcher === 'lance')  speed *= 2.2;   // a spear, not a shell
  if (launcher === 'mortar') speed *= 0.45;  // lobbed, must be led
  const rounds = launcher === 'seeker' ? 2 : 1;
  for (let i = 0; i < rounds; i++) {
    const spread = rounds > 1 ? (i - 0.5) * 0.35 : 0;
    const a = Math.atan2(dy, dx) + spread;
    interceptors.push({
      x: bx, y: by, ox: bx, oy: by,
      tx, ty, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      kind: launcher, life: 0, hitBy: []
    });
  }
  SFX.fire();
  // Every round gets its own trail. Discrete taps interleave rather than
  // cancelling each other, so a volley genuinely feels like several rounds in
  // the air. Length is the real flight time, so taps arrive with the round.
  haptic('launchTrail', 1, (len / speed) * 1000);
}

function destroyCity(city) {
  city.alive = false;
  city.smoke = 1;
  shake = Math.min(18, shake + 12);
  flash = 0.5;
  slowMo = 0.35;
  SFX.cityHit();
  haptic('city');
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI - Math.PI;
    const sp = 60 + Math.random() * 180;
    particles.push({
      x: city.x + (Math.random() * 40 - 20), y: groundY - 5,
      vx: Math.cos(a) * sp * 0.6, vy: -Math.abs(Math.sin(a)) * sp,
      life: 0.7 + Math.random() * 0.8, t: 0,
      col: Math.random() < 0.5 ? PALETTE.ink : PALETTE.red,
      size: 2 + Math.random() * 3
    });
  }
  if (!cities.some(c => c.alive)) {
    // Delay the game-over card a beat so the impact reads.
    setTimeout(() => {
      if (!cities.some(c => c.alive)) {
        highScore = Math.max(highScore, score);
        saveHighScore(highScore);
        SFX.gameOver();
        haptic('gameover');
        if (qualifies(score)) { entryName = ''; mode = MODE.ENTRY; }
        else mode = MODE.GAME_OVER;
      }
    }, 900);
  }
}

/* ------------------------------------------------------------------ */
/* Update                                                             */
/* ------------------------------------------------------------------ */
function update(dt) {
  titlePulse += dt;
  shake = Math.max(0, shake - dt * 40);
  flash = Math.max(0, flash - dt * 1.8);
  slowMo += (1 - slowMo) * Math.min(1, dt * 2.5);
  const d = dt * slowMo;

  cities.forEach(c => { if (c.smoke > 0) c.smoke = Math.max(0, c.smoke - dt * 0.06); });

  // Particles & floaters always tick (even on title / game over for flourish)
  particles = particles.filter(p => {
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 220 * dt;
    return p.t < p.life && p.y < groundY + 20;
  });
  floaters = floaters.filter(f => { f.t += dt; f.y -= 28 * dt; return f.t < f.life; });

  if (mode === MODE.PLAYING) {
    // The launcher choice runs on its own clock; the wave does not wait.
    if (pickTimer > 0) {
      pickTimer -= dt;
      if (pickTimer <= 0) {
        pickTimer = 0;
        addFloater(W / 2, H * 0.62, LAUNCHER_BY_ID[launcher].name + ' BY DEFAULT',
                   PALETTE.ink, false);
      }
    }
    // Spawn incoming warheads
    if (spawnQueue > 0) {
      spawnTimer -= d;
      if (spawnTimer <= 0) {
        missiles.push(spawnMissile());
        spawnQueue--;
        spawnTimer = spawnInterval * (0.6 + Math.random() * 0.8);
      }
    }

    // Bomber patrols
    if (bomberQueue > 0) {
      bomberTimer -= d;
      if (bomberTimer <= 0) {
        spawnBomber();
        bomberQueue--;
        bomberTimer = 4 + Math.random() * 4;
      }
    }
    for (let i = bombers.length - 1; i >= 0; i--) {
      const b = bombers[i];
      let bd = d;
      if (b.stun > 0) { b.stun -= dt; bd = d * 0.15; }
      b.t += bd;
      b.x += b.vx * bd;
      b.y = b.baseY + Math.sin(b.t * 2.1) * 10;
      b.drop -= bd;
      if (b.drop <= 0 && b.x > W * 0.08 && b.x < W * 0.92) {
        missiles.push(spawnMissile(b.x, b.y + 10, 1, 'std'));
        b.drop = 1.5 + Math.random() * 1.2;
        blip(240, 0.12, 'sine', 0.05, 0.55);
      }
      if ((b.dir === 1 && b.x > W + 70) || (b.dir === -1 && b.x < -70)) {
        bombers.splice(i, 1); // escaped, no points for you
      }
    }

    // Missiles
    for (let i = missiles.length - 1; i >= 0; i--) {
      const m = missiles[i];
      // Pulse-stalled threats crawl, and dodgers lose their nerve entirely.
      let md = d;
      if (m.stun > 0) { m.stun -= dt; md = d * 0.15; }
      if (m.type === 'shielded') m.shieldA += m.shieldSpin * md;
      if (m.type === 'phantom')  m.ghost += dt * 2.2;

      // Hunters ignore the cities and go for your rounds in the air.
      if (m.type === 'hunter' && !(m.stun > 0)) {
        let best = null, bestD = 1e9;
        for (const it of interceptors) {
          const dd = Math.hypot(it.x - m.x, it.y - m.y);
          if (dd < bestD) { bestD = dd; best = it; }
        }
        if (best) {
          const sp = Math.hypot(m.vx, m.vy) || 1;
          const wx = best.x - m.x, wy = best.y - m.y;
          const wl = Math.hypot(wx, wy) || 1;
          const turn = Math.min(1, md * 2.2);
          m.vx += (wx / wl * sp - m.vx) * turn;
          m.vy += (wy / wl * sp - m.vy) * turn;
          const nl = Math.hypot(m.vx, m.vy) || 1;
          m.vx = m.vx / nl * sp; m.vy = m.vy / nl * sp;
          if (bestD < 15) {
            const idx = interceptors.indexOf(best);
            if (idx !== -1) interceptors.splice(idx, 1);
            addFloater(m.x, m.y - 12, 'INTERCEPTED!', PALETTE.red, false);
            blip(180, 0.16, 'sawtooth', 0.06, 0.5);
            for (let k = 0; k < 10; k++) {
              const a = Math.random() * Math.PI * 2, sp2 = 50 + Math.random() * 90;
              particles.push({
                x: best.x, y: best.y, vx: Math.cos(a) * sp2, vy: Math.sin(a) * sp2,
                life: 0.4 + Math.random() * 0.3, t: 0, col: PALETTE.red,
                size: 2 + Math.random() * 2
              });
            }
          }
        }
      }

      // Dodgers swerve away from friendly blasts
      if (m.type === 'smart' && !(m.stun > 0)) {
        let ax = 0;
        for (const e of explosions) {
          if (e.hostile) continue;
          const ddx = m.x - e.x, ddy = m.y - e.y;
          const dist = Math.hypot(ddx, ddy);
          const danger = e.r + 55;
          if (dist < danger && dist > 1) ax += (ddx / dist) * 300 * (1 - dist / danger);
        }
        m.vx += ax * d;
        const maxVx = 100 + Math.min(180, wave * 3);
        m.vx = Math.max(-maxVx, Math.min(maxVx, m.vx));
        if ((m.x < 8 && m.vx < 0) || (m.x > W - 8 && m.vx > 0)) m.vx *= -0.6;
      }
      m.x += m.vx * md; m.y += m.vy * md;
      if (m.mirv && m.y >= m.mirvY) {
        m.mirv = false;
        const kids = 2 + (Math.random() < 0.4 ? 1 : 0);
        for (let k = 0; k < kids; k++) missiles.push(spawnMissile(m.x, m.y, m.depth + 1));
        missiles.splice(i, 1);
        blip(300, 0.15, 'sawtooth', 0.05, 2.2);
        continue;
      }
      if (m.y >= groundY) {
        if (m.type === 'burrower') {
          // Does not go off on impact. It digs in, and you have a few seconds
          // to blast it out of the ground before it takes the city anyway.
          buried.push({ x: m.x, t: 0, fuse: 5 });
          blip(120, 0.3, 'sawtooth', 0.06, 0.4);
          addFloater(m.x, groundY - 30, 'BURROWED!', PALETTE.red, false);
          shake = Math.min(10, shake + 3);
          missiles.splice(i, 1);
          continue;
        }
        spawnExplosion(m.x, groundY - 4, 0, true);
        shake = Math.min(14, shake + 5);
        // Did it land on a city?
        for (const c of cities) {
          if (c.alive && Math.abs(c.x - m.x) < 34) { destroyCity(c); break; }
        }
        missiles.splice(i, 1);
      }
    }

    // Buried warheads: a countdown you can still win
    for (let i = buried.length - 1; i >= 0; i--) {
      const bu = buried[i];
      bu.t += d;
      let dug = false;
      for (const e of explosions) {
        if (!e.hostile && !e.stun && Math.abs(e.x - bu.x) < e.r + 10 &&
            Math.abs(e.y - (groundY - 6)) < e.r + 14) { dug = true; break; }
      }
      if (dug) {
        const bpts = addScore(THREAT_SCORE.burrower);
        kills++;
        addFloater(bu.x, groundY - 34, `${bpts} DUG OUT`, PALETTE.teal, true);
        spawnExplosion(bu.x, groundY - 8, 1, false);
        haptic('hit', 0.9);
        buried.splice(i, 1);
        continue;
      }
      if (bu.t >= bu.fuse) {
        spawnExplosion(bu.x, groundY - 4, 0, true, { maxR: 52 });
        for (const c of cities) {
          if (c.alive && Math.abs(c.x - bu.x) < 46) { destroyCity(c); break; }
        }
        buried.splice(i, 1);
      }
    }

    // Interceptors — each launcher flies and detonates differently
    for (let i = interceptors.length - 1; i >= 0; i--) {
      const it = interceptors[i];
      it.life += d;

      if (it.kind === 'seeker') {
        // Steers onto the nearest live threat rather than a fixed point.
        let best = null, bestD = 1e9;
        for (const m of missiles) {
          const dd = Math.hypot(m.x - it.x, m.y - it.y);
          if (dd < bestD) { bestD = dd; best = m; }
        }
        if (best) {
          const sp = Math.hypot(it.vx, it.vy) || 1;
          const wantX = best.x - it.x, wantY = best.y - it.y;
          const wl = Math.hypot(wantX, wantY) || 1;
          const turn = Math.min(1, d * 5);   // firm but not instant
          it.vx += (wantX / wl * sp - it.vx) * turn;
          it.vy += (wantY / wl * sp - it.vy) * turn;
          const nl = Math.hypot(it.vx, it.vy) || 1;
          it.vx = it.vx / nl * sp; it.vy = it.vy / nl * sp;
          if (bestD < 14) {
            spawnExplosion(it.x, it.y, 0, false, { maxR: 34 });
            interceptors.splice(i, 1); continue;
          }
        }
      }

      if (it.kind === 'mortar') it.vy += 150 * d;   // arcs under gravity

      it.x += it.vx * d; it.y += it.vy * d;

      if (it.kind === 'lance') {
        // Does not stop at the target: spears onward, gutting the line.
        for (let j = missiles.length - 1; j >= 0; j--) {
          const m = missiles[j];
          if (it.hitBy.indexOf(m) !== -1) continue;
          if (Math.hypot(m.x - it.x, m.y - it.y) < 16) {
            it.hitBy.push(m);
            damageMissile(j, m, 1, it, it.x, it.y);
          }
        }
        for (let j = bombers.length - 1; j >= 0; j--) {
          const b = bombers[j];
          if (Math.hypot(b.x - it.x, b.y - it.y) < 18) killBomber(j, b, 1, it);
        }
        if (it.y < -30 || it.x < -30 || it.x > W + 30 || it.y > groundY) {
          interceptors.splice(i, 1);
        }
        continue;
      }

      const reached = it.kind === 'mortar'
        ? (it.vy > 0 && it.y >= it.ty)
        : ((it.vy < 0 && it.y <= it.ty) || (it.vy >= 0 && it.y >= it.ty));
      if (reached || (it.kind === 'seeker' && it.life > 3)) {
        detonate(it);
        interceptors.splice(i, 1);
      }
    }

    // Explosions grow / hold / shrink, and destroy missiles
    for (let i = explosions.length - 1; i >= 0; i--) {
      const e = explosions[i];
      e.t += d;
      if (e.phase === 0) {
        e.r += (e.maxR * 3.2) * d;
        if (e.r >= e.maxR) { e.r = e.maxR; e.phase = 1; e.t = 0; }
      } else if (e.phase === 1) {
        if (e.t > e.hold) { e.phase = 2; }
      } else {
        e.r -= (e.maxR * 2.4) * d;
        if (e.r <= 2) { explosions.splice(i, 1); continue; }
      }
      if (!e.hostile && e.stun) {
        // Pulse: no kills, but everything caught is stalled and dodgers lose
        // their nerve for the duration.
        for (const m of missiles) {
          if (Math.hypot(m.x - e.x, m.y - e.y) < e.r) m.stun = Math.max(m.stun || 0, 3);
        }
        for (const b of bombers) {
          if (Math.hypot(b.x - e.x, b.y - e.y) < e.r) b.stun = Math.max(b.stun || 0, 3);
        }
      } else if (!e.hostile) {
        for (let k = missiles.length - 1; k >= 0; k--) {
          const m = missiles[k];
          const rad = e.r + (m.type === 'heavy' ? 5 : 0);
          if (Math.hypot(m.x - e.x, m.y - e.y) < rad)
            damageMissile(k, m, e.chain + 1, e, e.x, e.y);
        }
        for (let k = bombers.length - 1; k >= 0; k--) {
          const b = bombers[k];
          if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 12)
            killBomber(k, b, e.chain + 1, e);
        }
      }
    }

    // Wave cleared?
    if (spawnQueue === 0 && missiles.length === 0 && explosions.length === 0 &&
        interceptors.length === 0 && bombers.length === 0 && bomberQueue === 0 &&
        buried.length === 0 && cities.some(c => c.alive)) {
      const cityCount = cities.filter(c => c.alive).length;
      waveBonus = { cities: Math.round(cityCount * 200 * diff().score),
                    ammo: Math.round(ammo * 50 * diff().score) };
      score += waveBonus.cities + waveBonus.ammo;
      highScore = Math.max(highScore, score);
      saveHighScore(highScore);
      SFX.waveDone();
      haptic('wave');
      if (DEMO && wave >= DEMO_WAVES) {
        mode = MODE.DEMO_END;
        highScore = Math.max(highScore, score);
        saveHighScore(highScore);
      } else if (wave >= FINAL_WAVE) {
        // The card comes first; the score table can wait for a tap.
        mode = MODE.VICTORY;
        highScore = Math.max(highScore, score);
        saveHighScore(highScore);
      } else {
        waveEndTimer = 2.6;
        mode = MODE.WAVE_END;
      }
    }
  } else if (mode === MODE.WAVE_END) {
    waveEndTimer -= dt;
    if (waveEndTimer <= 0) { startWave(); mode = MODE.PLAYING; }
  }
}

/* ------------------------------------------------------------------ */
/* Drawing                                                            */
/* ------------------------------------------------------------------ */
function starburst(x, y, rOuter, rInner, spokes, rot, fill, stroke) {
  ctx.beginPath();
  for (let i = 0; i < spokes * 2; i++) {
    const a = rot + (i / (spokes * 2)) * Math.PI * 2;
    const r = i % 2 === 0 ? rOuter : rInner;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}

function drawSky() {
  // Layered cream bands with a low retro sun.
  const g = ctx.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0, PALETTE.cream);
  g.addColorStop(1, PALETTE.paperDark);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, groundY);

  // Concentric sun rings, upper right — poster motif.
  const sx = W * 0.82, sy = H * 0.16;
  ctx.save();
  ctx.globalAlpha = 0.5;
  for (let i = 4; i >= 0; i--) {
    ctx.beginPath();
    ctx.arc(sx, sy, 26 + i * 22, 0, Math.PI * 2);
    ctx.fillStyle = i % 2 === 0 ? 'rgba(227,162,60,0.16)' : 'rgba(242,231,211,0.0)';
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.arc(sx, sy, 24, 0, Math.PI * 2);
  ctx.fillStyle = PALETTE.gold;
  ctx.fill();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.restore();
}

function drawGround() {
  ctx.fillStyle = PALETTE.ink;
  ctx.fillRect(0, groundY, W, H - groundY);
  // Ticker stripe
  ctx.fillStyle = PALETTE.red;
  ctx.fillRect(0, groundY, W, 4);
  // Diagonal hatch on the earth block
  ctx.save();
  ctx.beginPath(); ctx.rect(0, groundY + 4, W, H - groundY); ctx.clip();
  ctx.strokeStyle = 'rgba(242,231,211,0.07)';
  ctx.lineWidth = 3;
  for (let x = -H; x < W + H; x += 14) {
    ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x + (H - groundY), H); ctx.stroke();
  }
  ctx.restore();
}

function drawCity(c) {
  const baseY = groundY;
  ctx.save();
  ctx.translate(c.x, baseY);
  if (c.alive) {
    // Procedural skyline from seed: 5 blocks
    let rng = c.seed;
    const rnd = () => { rng = (rng * 9301 + 49297) % 233280; return rng / 233280; };
    ctx.fillStyle = PALETTE.ink;
    let bx = -28;
    for (let i = 0; i < 5; i++) {
      const bw = 8 + rnd() * 8;
      const bh = 12 + rnd() * 22;
      ctx.fillRect(bx, -bh, bw, bh);
      // Little windows in teal
      ctx.fillStyle = PALETTE.teal;
      for (let wy = -bh + 3; wy < -4; wy += 6) {
        if (rnd() < 0.7) ctx.fillRect(bx + 2, wy, 2.5, 3);
        if (bw > 12 && rnd() < 0.7) ctx.fillRect(bx + bw - 5, wy, 2.5, 3);
      }
      ctx.fillStyle = PALETTE.ink;
      bx += bw + 2;
    }
    // A wee radio mast
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -34); ctx.lineTo(0, -44); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -46, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE.red; ctx.fill();
  } else {
    // Rubble
    ctx.fillStyle = PALETTE.redDark;
    ctx.beginPath();
    ctx.moveTo(-30, 0); ctx.lineTo(-18, -8); ctx.lineTo(-8, -3);
    ctx.lineTo(2, -10); ctx.lineTo(14, -4); ctx.lineTo(28, -7); ctx.lineTo(30, 0);
    ctx.closePath(); ctx.fill();
    if (c.smoke > 0) {
      const t = performance.now() / 1000;
      for (let i = 0; i < 3; i++) {
        const yy = -14 - i * 14 - Math.sin(t * 1.4 + i) * 3;
        const rr = (5 + i * 3.5) * (0.6 + c.smoke * 0.4);
        ctx.beginPath();
        ctx.arc(Math.sin(t + i * 2) * 5, yy, rr, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(33,48,58,${0.28 * c.smoke})`;
        ctx.fill();
      }
    }
  }
  ctx.restore();
}

function drawBattery() {
  const bx = batteryX(), by = groundY;
  ctx.save();
  ctx.translate(bx, by);
  // Bunker mound
  ctx.fillStyle = PALETTE.ink;
  ctx.beginPath();
  ctx.moveTo(-36, 0);
  ctx.quadraticCurveTo(0, -30, 36, 0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = PALETTE.gold; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-30, -3);
  ctx.quadraticCurveTo(0, -26, 30, -3);
  ctx.stroke();
  // Barrel points at pointer target region — keep it simple, straight up.
  ctx.fillStyle = PALETTE.red;
  ctx.fillRect(-4, -34, 8, 18);
  ctx.beginPath(); ctx.arc(0, -34, 5, 0, Math.PI * 2); ctx.fill();
  // Ammo pips on the mound
  ctx.fillStyle = PALETTE.cream;
  const pips = Math.min(ammo, 12);
  for (let i = 0; i < pips; i++) {
    const a = Math.PI + (i / 11) * Math.PI;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * 24, Math.sin(a) * 20 * 0.9 - 2, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawMissile(m) {
  const len = Math.hypot(m.vx, m.vy) || 1;

  if (m.type === 'smart') {
    // Dodger: no full trail (it doesn't fly straight), jittery gold dart
    ctx.strokeStyle = 'rgba(227,162,60,0.85)';
    ctx.lineWidth = 2.5;
    const tl = 20;
    ctx.beginPath();
    ctx.moveTo(m.x - m.vx / len * tl + (Math.random() - 0.5) * 3,
               m.y - m.vy / len * tl + (Math.random() - 0.5) * 3);
    ctx.lineTo(m.x, m.y);
    ctx.stroke();
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(Math.atan2(m.vy, m.vx) + Math.PI / 4);
    ctx.fillStyle = PALETTE.gold;
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 1.5;
    ctx.fillRect(-4, -4, 8, 8);
    ctx.strokeRect(-4, -4, 8, 8);
    ctx.restore();
    return;
  }

  if (m.type === 'heavy') {
    // Armoured heavy: thick dark trail, fat body, ring shows remaining armour
    ctx.strokeStyle = 'rgba(179,42,27,0.35)';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(m.ox, m.oy); ctx.lineTo(m.x, m.y); ctx.stroke();
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(Math.atan2(m.vy, m.vx) + Math.PI / 2);
    ctx.fillStyle = PALETTE.ink;
    ctx.beginPath();
    ctx.moveTo(0, 9); ctx.lineTo(-6, -6); ctx.lineTo(0, -10); ctx.lineTo(6, -6);
    ctx.closePath(); ctx.fill();
    if (m.hp > 1) {
      // Armour plating: stubby fins and the tell-tale red ring
      ctx.fillRect(-9, -8, 4, 6); ctx.fillRect(5, -8, 4, 6);
      ctx.strokeStyle = PALETTE.red;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.stroke();
    } else {
      // Armour shed: no ring, no fins — just the exposed core glowing
      ctx.beginPath(); ctx.arc(0, -2, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = PALETTE.gold; ctx.fill();
    }
    ctx.restore();
    return;
  }

  if (m.type === 'hunter') {
    // Predatory dart: swept wings, gold eye, no long trail (it manoeuvres)
    ctx.strokeStyle = 'rgba(222,59,38,0.5)';
    ctx.lineWidth = 2.5;
    const tl2 = 22;
    ctx.beginPath();
    ctx.moveTo(m.x - m.vx / len * tl2, m.y - m.vy / len * tl2);
    ctx.lineTo(m.x, m.y); ctx.stroke();
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(Math.atan2(m.vy, m.vx));
    ctx.fillStyle = PALETTE.redDark;
    ctx.beginPath();
    ctx.moveTo(11, 0); ctx.lineTo(-7, -7); ctx.lineTo(-3, 0); ctx.lineTo(-7, 7);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(2, 0, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE.gold; ctx.fill();
    ctx.restore();
    return;
  }

  if (m.type === 'shielded') {
    ctx.strokeStyle = 'rgba(46,140,133,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(m.ox, m.oy); ctx.lineTo(m.x, m.y); ctx.stroke();
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.fillStyle = PALETTE.ink;
    ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, Math.PI * 2); ctx.fill();
    // The plate: a thick arc you must shoot around
    ctx.strokeStyle = PALETTE.tealDark;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(0, 0, 13, m.shieldA - 1.0, m.shieldA + 1.0);
    ctx.stroke();
    ctx.strokeStyle = PALETTE.cream; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 13, m.shieldA - 1.0, m.shieldA + 1.0);
    ctx.stroke();
    ctx.restore();
    return;
  }

  if (m.type === 'phantom') {
    // Fades in and out; blast light nearby drags it back into view.
    let a = 0.28 + 0.36 * (0.5 + 0.5 * Math.sin(m.ghost));
    for (const e of explosions) {
      if (Math.hypot(m.x - e.x, m.y - e.y) < e.r + 70) { a = 1; break; }
    }
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = PALETTE.tealDark; ctx.lineWidth = 2;
    const tl3 = 18;
    ctx.beginPath();
    ctx.moveTo(m.x - m.vx / len * tl3, m.y - m.vy / len * tl3);
    ctx.lineTo(m.x, m.y); ctx.stroke();
    ctx.beginPath(); ctx.arc(m.x, m.y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE.ink; ctx.fill();
    ctx.strokeStyle = PALETTE.cream; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
    return;
  }

  if (m.type === 'burrower') {
    ctx.strokeStyle = 'rgba(33,48,58,0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(m.ox, m.oy); ctx.lineTo(m.x, m.y); ctx.stroke();
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(Math.atan2(m.vy, m.vx) + Math.PI / 2);
    ctx.fillStyle = PALETTE.ink;
    ctx.beginPath();
    ctx.moveTo(0, 11); ctx.lineTo(-5, -4); ctx.lineTo(0, -9); ctx.lineTo(5, -4);
    ctx.closePath(); ctx.fill();
    // Drill bit
    ctx.strokeStyle = PALETTE.gold; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-4, 7); ctx.lineTo(4, 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-4, 3); ctx.lineTo(4, 5); ctx.stroke();
    ctx.restore();
    return;
  }

  // Standard warhead: full trail from origin, poster-red
  ctx.strokeStyle = 'rgba(222,59,38,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(m.ox, m.oy); ctx.lineTo(m.x, m.y); ctx.stroke();
  ctx.strokeStyle = PALETTE.red;
  ctx.lineWidth = 3;
  const tl = 16;
  ctx.beginPath();
  ctx.moveTo(m.x - m.vx / len * tl, m.y - m.vy / len * tl);
  ctx.lineTo(m.x, m.y);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(m.x, m.y, 3.4, 0, Math.PI * 2);
  ctx.fillStyle = PALETTE.ink; ctx.fill();
  if (m.mirv) {
    ctx.strokeStyle = PALETTE.gold; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(m.x, m.y, 6.5, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawBuried(bu) {
  const urgency = bu.t / bu.fuse;
  ctx.save();
  ctx.translate(bu.x, groundY);
  // Spoil heap
  ctx.fillStyle = PALETTE.redDark;
  ctx.beginPath();
  ctx.moveTo(-18, 0); ctx.lineTo(-10, -9); ctx.lineTo(0, -12);
  ctx.lineTo(10, -9); ctx.lineTo(18, 0);
  ctx.closePath(); ctx.fill();
  // Fuse light, blinking faster as the clock runs down
  const blink = Math.sin(bu.t * (6 + urgency * 22)) > 0;
  ctx.beginPath(); ctx.arc(0, -16, 4, 0, Math.PI * 2);
  ctx.fillStyle = blink ? PALETTE.red : PALETTE.cream;
  ctx.fill();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 1.5; ctx.stroke();
  // Countdown ring
  ctx.strokeStyle = PALETTE.red; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(0, -16, 10, -Math.PI / 2, -Math.PI / 2 + (1 - urgency) * Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawBomber(b) {
  if (b.type === 'carrier') { drawCarrier(b); return; }
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.scale(b.dir, 1);
  // Flying-wing silhouette
  ctx.fillStyle = PALETTE.ink;
  ctx.beginPath();
  ctx.moveTo(16, 0);
  ctx.quadraticCurveTo(4, -9, -16, -5);
  ctx.quadraticCurveTo(-10, 0, -16, 5);
  ctx.quadraticCurveTo(4, 9, 16, 0);
  ctx.closePath(); ctx.fill();
  // Tail fin
  ctx.beginPath();
  ctx.moveTo(-12, -3); ctx.lineTo(-18, -10); ctx.lineTo(-14, -2);
  ctx.closePath(); ctx.fill();
  // Roundel
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2);
  ctx.fillStyle = PALETTE.red; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, 1.8, 0, Math.PI * 2);
  ctx.fillStyle = PALETTE.cream; ctx.fill();
  // Propeller blur
  ctx.strokeStyle = 'rgba(33,48,58,0.4)';
  ctx.lineWidth = 2;
  const spin = performance.now() / 40;
  ctx.beginPath();
  ctx.moveTo(16, Math.sin(spin) * 6);
  ctx.lineTo(16, -Math.sin(spin) * 6);
  ctx.stroke();
  ctx.restore();
}

function drawCarrier(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.scale(b.dir, 1);
  // Airship envelope
  ctx.fillStyle = PALETTE.ink;
  ctx.beginPath();
  ctx.ellipse(0, -4, 34, 13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = PALETTE.cream; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-30, -4); ctx.lineTo(30, -4); ctx.stroke();
  // Tail fins
  ctx.fillStyle = PALETTE.redDark;
  ctx.beginPath();
  ctx.moveTo(-30, -4); ctx.lineTo(-42, -14); ctx.lineTo(-34, -3);
  ctx.closePath(); ctx.fill();
  // Gondola, one per remaining hull point
  ctx.fillStyle = PALETTE.ink;
  for (let i = 0; i < b.hp; i++) {
    const gx = -12 + i * 12;
    ctx.fillRect(gx - 4, 8, 8, 6);
  }
  ctx.beginPath(); ctx.arc(14, -4, 5, 0, Math.PI * 2);
  ctx.fillStyle = PALETTE.red; ctx.fill();
  ctx.beginPath(); ctx.arc(14, -4, 2.2, 0, Math.PI * 2);
  ctx.fillStyle = PALETTE.cream; ctx.fill();
  ctx.restore();
}

function drawInterceptor(it) {
  const lc = LAUNCHER_BY_ID[it.kind] || LAUNCHERS[0];
  const isLance = it.kind === 'lance';
  ctx.strokeStyle = 'rgba(46,140,133,0.35)';
  ctx.lineWidth = isLance ? 3 : 2;
  ctx.beginPath(); ctx.moveTo(it.ox, it.oy); ctx.lineTo(it.x, it.y); ctx.stroke();
  ctx.strokeStyle = lc.col;
  ctx.lineWidth = isLance ? 5 : 3;
  const len = Math.hypot(it.vx, it.vy) || 1;
  const tl = isLance ? 46 : 14;
  ctx.beginPath();
  ctx.moveTo(it.x - it.vx / len * tl, it.y - it.vy / len * tl);
  ctx.lineTo(it.x, it.y);
  ctx.stroke();
  if (it.kind === 'atom') {
    ctx.beginPath(); ctx.arc(it.x, it.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE.gold; ctx.fill();
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 1.5; ctx.stroke();
  }
  // Target reticle — meaningless for a lance, which never stops
  if (!isLance && it.kind !== 'seeker') {
    ctx.strokeStyle = 'rgba(33,48,58,0.5)';
    ctx.lineWidth = 1.5;
    const s = 6;
    ctx.beginPath();
    ctx.moveTo(it.tx - s, it.ty); ctx.lineTo(it.tx + s, it.ty);
    ctx.moveTo(it.tx, it.ty - s); ctx.lineTo(it.tx, it.ty + s);
    ctx.stroke();
  }
}

function drawExplosion(e) {
  const col   = e.col || (e.hostile ? PALETTE.red : (e.chain ? PALETTE.gold : PALETTE.teal));
  const inner = e.hostile ? PALETTE.gold : PALETTE.cream;
  starburst(e.x, e.y, e.r, e.r * 0.55, e.spokes, e.rot + e.t * 1.6, col, PALETTE.ink);
  starburst(e.x, e.y, e.r * 0.55, e.r * 0.3, e.spokes, -e.rot - e.t * 2.2, inner, null);
  // Halftone speckle inside the burst
  ctx.save();
  ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.9, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = 'rgba(33,48,58,0.22)';
  const step = 8;
  for (let yy = e.y - e.r; yy < e.y + e.r; yy += step)
    for (let xx = e.x - e.r + ((yy / step) % 2) * 4; xx < e.x + e.r; xx += step) {
      ctx.beginPath(); ctx.arc(xx, yy, 1.2, 0, Math.PI * 2); ctx.fill();
    }
  ctx.restore();
}

function drawHUD() {
  const padT = 14 + SAFE.top;
  const padL = 14 + SAFE.left;
  const padR = 14 + SAFE.right;
  ctx.textBaseline = 'top';
  // Score plate, top left
  ctx.font = '700 12px "IBM Plex Mono", monospace';
  ctx.fillStyle = PALETTE.ink;
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', padL, padT);
  ctx.font = '26px "Fugaz One", sans-serif';
  ctx.fillStyle = PALETTE.red;
  ctx.fillText(String(score).padStart(6, '0'), padL, padT + 14);
  // High score just below
  ctx.font = '700 11px "IBM Plex Mono", monospace';
  ctx.fillStyle = 'rgba(33,48,58,0.55)';
  ctx.fillText('BEST ' + String(highScore).padStart(6, '0'), padL, padT + 44);
  ctx.fillStyle = diff().col;
  ctx.fillText(diff().name, padL, padT + 58);

  // Wave, top centre
  ctx.textAlign = 'center';
  ctx.font = '700 12px "IBM Plex Mono", monospace';
  ctx.fillStyle = PALETTE.ink;
  ctx.fillText('WAVE', W / 2, padT);
  ctx.font = '26px "Fugaz One", sans-serif';
  ctx.fillStyle = PALETTE.ink;
  ctx.fillText(String(wave), W / 2, padT + 14);

  // Ammo, top right
  ctx.textAlign = 'right';
  ctx.font = '700 12px "IBM Plex Mono", monospace';
  ctx.fillStyle = PALETTE.ink;
  const lc = LAUNCHER_BY_ID[launcher] || LAUNCHERS[0];
  ctx.fillText(lc.name, W - padR, padT);
  ctx.font = '26px "Fugaz One", sans-serif';
  ctx.fillStyle = ammo > 3 ? lc.col : PALETTE.red;
  ctx.fillText(String(ammo), W - padR, padT + 14);

  if (mode === MODE.PLAYING) {
    // Pause plate tucked into the ground strip, clear of the sky and battery.
    const ps = 30;
    const stripTop = groundY + 4, stripBot = H - SAFE.bottom;
    const px0 = W - padR - ps;
    const py0 = stripTop + Math.max(4, (stripBot - stripTop - ps) / 2);
    ctx.fillStyle = PALETTE.red; ctx.fillRect(px0 + 3, py0 + 3, ps, ps);
    ctx.fillStyle = PALETTE.cream; ctx.fillRect(px0, py0, ps, ps);
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2; ctx.strokeRect(px0, py0, ps, ps);
    ctx.fillStyle = PALETTE.ink;
    ctx.fillRect(px0 + 9, py0 + 8, 4, 14);
    ctx.fillRect(px0 + 17, py0 + 8, 4, 14);
    uiButtons.push({ x: px0 - 8, y: py0 - 8, w: ps + 16, h: ps + 16,
                     action: () => { hapticStop(); mode = MODE.PAUSED; } });
  }
}

function drawFloaters() {
  for (const f of floaters) {
    const a = 1 - f.t / f.life;
    ctx.globalAlpha = a;
    ctx.font = (f.big ? '22px' : '15px') + ' "Fugaz One", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = PALETTE.cream; ctx.lineWidth = 4;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.col;
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }
}

function drawCard(title, lines, footer, accent) {
  // Poster card centred on screen
  const cw = Math.min(W * 0.86, 460);
  const ch = 210 + lines.length * 26;
  const cx = (W - cw) / 2, cy = (H - ch) / 2 - 20;
  ctx.save();
  // Drop shadow, offset print style
  ctx.fillStyle = PALETTE.red;
  ctx.fillRect(cx + 7, cy + 7, cw, ch);
  ctx.fillStyle = PALETTE.cream;
  ctx.fillRect(cx, cy, cw, ch);
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 3;
  ctx.strokeRect(cx, cy, cw, ch);
  ctx.strokeRect(cx + 8, cy + 8, cw - 16, ch - 16);

  // Starburst behind the title
  starburst(W / 2, cy + 64, 46 + Math.sin(titlePulse * 2.4) * 3, 26, 12,
            titlePulse * 0.5, accent || PALETTE.gold, PALETTE.ink);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = (title.length > 10 ? '30px' : '40px') + ' "Fugaz One", sans-serif';
  ctx.lineWidth = 6; ctx.strokeStyle = PALETTE.cream;
  ctx.strokeText(title, W / 2, cy + 64);
  ctx.fillStyle = PALETTE.ink;
  ctx.fillText(title, W / 2, cy + 64);

  ctx.font = '700 14px "IBM Plex Mono", monospace';
  lines.forEach((ln, i) => {
    ctx.fillStyle = ln.col || PALETTE.ink;
    ctx.fillText(ln.text || ln, W / 2, cy + 118 + i * 26);
  });

  const blink = Math.sin(titlePulse * 4) > -0.3;
  if (footer && blink) {
    ctx.font = '700 13px "IBM Plex Mono", monospace';
    ctx.fillStyle = PALETTE.red;
    ctx.fillText(footer, W / 2, cy + ch - 34);
  }
  ctx.restore();
  return { cx, cy, cw, ch };
}

/* ------------------------------------------------------------------ */
/* Menu & pause UI — poster plates, hit-tested each frame             */
/* ------------------------------------------------------------------ */
let uiButtons = [];

function button(x, y, w, h, label, action, opts) {
  opts = opts || {};
  ctx.save();
  ctx.fillStyle = PALETTE.red;
  ctx.fillRect(x + 4, y + 4, w, h);
  ctx.fillStyle = opts.primary ? PALETTE.red : PALETTE.cream;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2.5;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = opts.primary ? PALETTE.cream : PALETTE.ink;
  ctx.font = opts.big ? '26px "Fugaz One", sans-serif'
                      : '700 13px "IBM Plex Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  ctx.restore();
  uiButtons.push({ x, y, w, h, label, action });
}

function toggleRow(y) {
  const gap = 12, w = Math.min((W * 0.86 - gap) / 2, 190), h = 38;
  const x0 = (W - w * 2 - gap) / 2;
  button(x0, y, w, h, 'SOUND ' + (settings.sound ? 'ON' : 'OFF'), () => {
    settings.sound = !settings.sound; saveSettings();
    if (settings.sound) SFX.fire();
  });
  button(x0 + w + gap, y, w, h, 'HAPTICS ' + (settings.haptics ? 'ON' : 'OFF'), () => {
    settings.haptics = !settings.haptics; saveSettings();
    // A launch trail is a queue of scheduled ticks on the native side; without
    // this, one already in flight would keep buzzing after you switched off.
    if (!settings.haptics) hapticStop();
  });
}

function drawMenu() {
  const cy = Math.max(H * 0.28, SAFE.top + 96);
  starburst(W / 2, cy, 86 + Math.sin(titlePulse * 2.4) * 4, 48, 12,
            titlePulse * 0.5, PALETTE.gold, PALETTE.ink);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const small = W < 430;
  ctx.font = (small ? '36px' : '52px') + ' "Fugaz One", sans-serif';
  ctx.lineWidth = 8; ctx.strokeStyle = PALETTE.cream;
  ctx.strokeText('ATOMIC DEFENCE', W / 2, cy);
  ctx.fillStyle = PALETTE.ink;
  ctx.fillText('ATOMIC DEFENCE', W / 2, cy);
  ctx.font = '700 13px "IBM Plex Mono", monospace';
  ctx.lineWidth = 4; ctx.strokeStyle = PALETTE.cream;
  ctx.strokeText('DEFEND THE SIX CITIES', W / 2, cy + (small ? 36 : 46));
  ctx.fillStyle = PALETTE.red;
  ctx.fillText('DEFEND THE SIX CITIES', W / 2, cy + (small ? 36 : 46));
  if (highScore > 0) {
    ctx.strokeText('BEST ' + String(highScore).padStart(6, '0'), W / 2, cy + (small ? 58 : 70));
    ctx.fillStyle = 'rgba(33,48,58,0.75)';
    ctx.fillText('BEST ' + String(highScore).padStart(6, '0'), W / 2, cy + (small ? 58 : 70));
  }
  const bw = Math.min(W * 0.62, 260);
  const by = Math.min(H * 0.44, H - 300);
  button((W - bw) / 2, by, bw, 56, 'PLAY', () => {
    resetGame();
    restartLockUntil = performance.now() + 300;
  }, { primary: true, big: true });
  button((W - bw) / 2, by + 68, bw, 40, 'HOW TO PLAY', () => { mode = MODE.HOWTO; });
  button((W - bw) / 2, by + 116, bw, 40, 'HIGH SCORES',
    () => { entryIdx = -1; mode = MODE.SCORES; });
  difficultyRow(by + 188);
  toggleRow(by + 246);
}

/* Four plates, the chosen one filled. Score multiplier is shown because it is
   the reason to pick anything other than EASY. */
function difficultyRow(y) {
  const gap = 6;
  const margin = Math.max(10, SAFE.left + 6);
  const bw = Math.min((W - margin * 2 - gap * 3) / 4, 92);
  const x0 = (W - (bw * 4 + gap * 3)) / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 10px "IBM Plex Mono", monospace';
  ctx.lineWidth = 3; ctx.strokeStyle = PALETTE.cream;
  ctx.strokeText('DIFFICULTY', W / 2, y - 12);
  ctx.fillStyle = 'rgba(33,48,58,0.6)';
  ctx.fillText('DIFFICULTY', W / 2, y - 12);
  DIFFICULTIES.forEach((D, i) => {
    const x = x0 + i * (bw + gap);
    const on = D.id === settings.difficulty;
    const h = 40;
    ctx.fillStyle = PALETTE.red;
    ctx.fillRect(x + 3, y + 3, bw, h);
    ctx.fillStyle = on ? D.col : PALETTE.cream;
    ctx.fillRect(x, y, bw, h);
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = on ? 3.5 : 2;
    ctx.strokeRect(x, y, bw, h);
    ctx.fillStyle = on ? PALETTE.cream : PALETTE.ink;
    fitText(D.name, bw - 8, 13, '"Fugaz One", sans-serif');
    ctx.fillText(D.name, x + bw / 2, y + 15);
    ctx.font = '700 9px "IBM Plex Mono", monospace';
    ctx.fillStyle = on ? PALETTE.cream : 'rgba(33,48,58,0.55)';
    ctx.fillText('×' + D.score, x + bw / 2, y + 30);
    uiButtons.push({ x, y, w: bw, h, label: 'DIFF_' + D.id, action: () => {
      settings.difficulty = D.id; saveSettings();
    } });
  });
}

function drawEntry() {
  ctx.fillStyle = 'rgba(242,231,211,0.95)';
  ctx.fillRect(0, 0, W, H);
  const cy = Math.max(H * 0.12, SAFE.top + 56);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '30px "Fugaz One", sans-serif';
  ctx.lineWidth = 6; ctx.strokeStyle = PALETTE.cream;
  ctx.strokeText('NEW HIGH SCORE', W / 2, cy);
  ctx.fillStyle = PALETTE.red;
  ctx.fillText('NEW HIGH SCORE', W / 2, cy);
  ctx.font = '700 15px "IBM Plex Mono", monospace';
  ctx.fillStyle = PALETTE.ink;
  ctx.fillText(String(score).padStart(6, '0') + '  ·  WAVE ' + wave +
               '  ·  ' + diff().name, W / 2, cy + 30);
  // Three initial slots
  const sw = 46, sgap = 14;
  const sx0 = W / 2 - (sw * 3 + sgap * 2) / 2;
  const sy = cy + 62;
  for (let i = 0; i < 3; i++) {
    const x = sx0 + i * (sw + sgap);
    ctx.fillStyle = PALETTE.cream; ctx.fillRect(x, sy, sw, sw);
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2.5; ctx.strokeRect(x, sy, sw, sw);
    ctx.font = '28px "Fugaz One", sans-serif';
    ctx.fillStyle = i === entryName.length ? PALETTE.red : PALETTE.ink;
    const blink = Math.sin(titlePulse * 5) > 0;
    ctx.fillText(entryName[i] || (i === entryName.length && blink ? '_' : ''),
                 x + sw / 2, sy + sw / 2 + 2);
  }
  // Letter grid: A-Z plus delete and OK
  const cols = 6, gap = 7;
  const margin = Math.max(W * 0.05, SAFE.left + 10);
  const cw = Math.min((W - margin * 2 - gap * (cols - 1)) / cols, 58);
  const gx0 = (W - (cw * cols + gap * (cols - 1))) / 2;
  const gy0 = sy + sw + 28;
  const keys = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  keys.forEach((L, i) => {
    const cx = gx0 + (i % cols) * (cw + gap);
    const cyy = gy0 + Math.floor(i / cols) * (cw + gap);
    button(cx, cyy, cw, cw, L, () => {
      if (entryName.length < 3) { entryName += L; blip(700, 0.05, 'square', 0.05); }
    });
  });
  const lastRowY = gy0 + 4 * (cw + gap);
  button(gx0 + 2 * (cw + gap), lastRowY, cw, cw, '<', () => {
    entryName = entryName.slice(0, -1); blip(300, 0.05, 'square', 0.05);
  });
  button(gx0 + 3 * (cw + gap), lastRowY, cw * 2 + gap, cw, 'OK', () => {
    if (entryName.length) commitEntry();
  }, { primary: true });
}

function drawScores() {
  ctx.fillStyle = 'rgba(242,231,211,0.95)';
  ctx.fillRect(0, 0, W, H);
  const cy = Math.max(H * 0.16, SAFE.top + 76);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '32px "Fugaz One", sans-serif';
  ctx.lineWidth = 6; ctx.strokeStyle = PALETTE.cream;
  ctx.strokeText('HIGH SCORES', W / 2, cy);
  ctx.fillStyle = PALETTE.ink;
  ctx.fillText('HIGH SCORES', W / 2, cy);
  // Rule under the masthead, poster style
  const tw = Math.min(W * 0.82, 340);
  const tx = (W - tw) / 2;
  ctx.fillStyle = PALETTE.red;
  ctx.fillRect(tx, cy + 30, tw, 3);

  ctx.font = '700 16px "IBM Plex Mono", monospace';
  if (!scoreTable.length) {
    ctx.fillStyle = PALETTE.ink;
    ctx.fillText('NO SCORES YET', W / 2, H * 0.42);
    ctx.fillStyle = PALETTE.red;
    ctx.fillText('GO MAKE HISTORY', W / 2, H * 0.42 + 28);
  } else {
    // Column header
    ctx.font = '700 11px "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(33,48,58,0.5)';
    ctx.textAlign = 'left';
    ctx.fillText('NAME', tx + 34, cy + 50);
    ctx.textAlign = 'right';
    ctx.fillText('SCORE', tx + tw - 52, cy + 50);
    ctx.fillText('WV', tx + tw - 20, cy + 50);
    ctx.fillText('D', tx + tw, cy + 50);

    scoreTable.forEach((r, i) => {
      const y = cy + 76 + i * 34;
      const fresh = i === entryIdx;
      const hot = fresh && Math.sin(titlePulse * 4) > -0.5;
      // The newest entry pulses; the champion always wears gold.
      const col = hot ? PALETTE.red
                      : fresh ? PALETTE.gold
                      : i === 0 ? PALETTE.gold : PALETTE.ink;
      if (fresh) {
        ctx.fillStyle = 'rgba(227,162,60,0.18)';
        ctx.fillRect(tx - 6, y - 15, tw + 12, 30);
      }
      ctx.font = '700 15px "IBM Plex Mono", monospace';
      ctx.fillStyle = col;
      ctx.textAlign = 'left';
      ctx.fillText((i + 1) + '.', tx, y);
      ctx.font = '18px "Fugaz One", sans-serif';
      ctx.fillText((r.n + '   ').slice(0, 3), tx + 34, y);
      ctx.font = '700 15px "IBM Plex Mono", monospace';
      ctx.textAlign = 'right';
      ctx.fillText(String(r.s).padStart(6, '0'), tx + tw - 52, y);
      ctx.fillStyle = fresh ? col : 'rgba(33,48,58,0.6)';
      ctx.font = '700 13px "IBM Plex Mono", monospace';
      ctx.fillText(String(r.w), tx + tw - 20, y);
      // Entries predate the difficulty setting are treated as medium.
      const rd = DIFF_BY_ID[r.d] || DIFFICULTIES[1];
      ctx.fillStyle = fresh ? col : rd.col;
      ctx.fillText(rd.short, tx + tw, y);
    });
    ctx.textAlign = 'center';
  }
  const blink = Math.sin(titlePulse * 4) > -0.3;
  if (blink) {
    ctx.font = '700 13px "IBM Plex Mono", monospace';
    ctx.fillStyle = PALETTE.red;
    ctx.fillText('— TAP TO RETURN —', W / 2, H - Math.max(56, SAFE.bottom + 40));
  }
}

/* The choice strip. Sits low over the ground so the sky stays readable, and
   the bar draining across the top of it is the only warning you get. */
/* Shrink text until it fits the box, so long names never bleed into neighbours. */
function fitText(text, maxW, startPx, family) {
  let px = startPx;
  ctx.font = px + 'px ' + family;
  while (ctx.measureText(text).width > maxW && px > 7) {
    px -= 1;
    ctx.font = px + 'px ' + family;
  }
}

function drawLauncherPick() {
  const list = unlockedLaunchers();
  const gap = 6, bh = 50;
  const margin = Math.max(10, SAFE.left + 6);
  // Two rows once there are more than four, so the names stay legible and the
  // targets stay thumb-sized on a phone.
  const perRow = list.length > 4 ? Math.ceil(list.length / 2) : list.length;
  const rows = Math.ceil(list.length / perRow);
  const bw = Math.min((W - margin * 2 - gap * (perRow - 1)) / perRow, 96);
  const blockH = rows * bh + (rows - 1) * gap;
  const y0 = groundY - blockH - 66;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 12px "IBM Plex Mono", monospace';
  ctx.lineWidth = 4; ctx.strokeStyle = PALETTE.cream;
  ctx.strokeText('ARM A LAUNCHER — QUICK', W / 2, y0 - 22);
  ctx.fillStyle = PALETTE.red;
  ctx.fillText('ARM A LAUNCHER — QUICK', W / 2, y0 - 22);

  const barW = Math.min(W - margin * 2, bw * perRow + gap * (perRow - 1));
  ctx.fillStyle = 'rgba(33,48,58,0.25)';
  ctx.fillRect((W - barW) / 2, y0 - 11, barW, 4);
  ctx.fillStyle = pickTimer < 1.5 ? PALETTE.red : PALETTE.ink;
  ctx.fillRect((W - barW) / 2, y0 - 11, barW * Math.max(0, pickTimer / 4), 4);

  const cfgNow = waveConfig(wave);
  const rounds = (l) => baseAmmo(cfgNow, l);
  list.forEach((l, i) => {
    const r = Math.floor(i / perRow);
    const inRow = Math.min(perRow, list.length - r * perRow);
    const rowW = bw * inRow + gap * (inRow - 1);
    const x = (W - rowW) / 2 + (i % perRow) * (bw + gap);
    const y = y0 + r * (bh + gap);
    const on = l.id === launcher;
    ctx.fillStyle = PALETTE.red;
    ctx.fillRect(x + 3, y + 3, bw, bh);
    ctx.fillStyle = on ? l.col : PALETTE.cream;
    ctx.fillRect(x, y, bw, bh);
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = on ? 3.5 : 2;
    ctx.strokeRect(x, y, bw, bh);
    ctx.fillStyle = on ? PALETTE.cream : PALETTE.ink;
    fitText(l.name, bw - 10, 16, '"Fugaz One", sans-serif');
    ctx.fillText(l.name, x + bw / 2, y + 18);
    ctx.font = '700 9px "IBM Plex Mono", monospace';
    ctx.fillStyle = on ? PALETTE.cream : 'rgba(33,48,58,0.6)';
    ctx.fillText(rounds(l) + ' RDS', x + bw / 2, y + 36);
    uiButtons.push({ x, y, w: bw, h: bh, label: 'PICK_' + l.id,
                     action: () => chooseLauncher(l.id) });
  });
}

function drawPauseScreen() {
  ctx.fillStyle = 'rgba(242,231,211,0.78)';
  ctx.fillRect(0, 0, W, H);
  const cy = Math.max(H * 0.22, SAFE.top + 80);
  starburst(W / 2, cy, 52, 30, 12, titlePulse * 0.5, PALETTE.teal, PALETTE.ink);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '34px "Fugaz One", sans-serif';
  ctx.lineWidth = 6; ctx.strokeStyle = PALETTE.cream;
  ctx.strokeText('PAUSED', W / 2, cy);
  ctx.fillStyle = PALETTE.ink;
  ctx.fillText('PAUSED', W / 2, cy);
  ctx.font = '700 13px "IBM Plex Mono", monospace';
  ctx.fillStyle = PALETTE.ink;
  ctx.fillText('SCORE ' + String(score).padStart(6, '0') + '  ·  WAVE ' + wave,
               W / 2, cy + 34);
  const bw = Math.min(W * 0.6, 240);
  const by = H * 0.42;
  button((W - bw) / 2, by, bw, 50, 'RESUME',
    () => { mode = MODE.PLAYING; }, { primary: true });
  button((W - bw) / 2, by + 64, bw, 40, 'QUIT TO MENU', () => {
    // Bowing out still earns your place on the board.
    if (qualifies(score)) { entryName = ''; mode = MODE.ENTRY; }
    else mode = MODE.MENU;
  });
  toggleRow(by + 124);
}

function render() {
  uiButtons = [];
  ctx.save();
  // Screen shake
  if (shake > 0.2) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  drawSky();
  drawGround();
  // Skylines sit on the horizon line, clipped to the sky region
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, groundY); ctx.clip();
  cities.forEach(drawCity);
  ctx.restore();
  drawBattery();

  buried.forEach(drawBuried);
  bombers.forEach(drawBomber);
  missiles.forEach(drawMissile);
  interceptors.forEach(drawInterceptor);
  explosions.forEach(drawExplosion);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    ctx.globalAlpha = 1;
  }
  // Floaters and HUD would show through the full-screen plates; skip them there.
  if (mode === MODE.PLAYING && pickTimer > 0) drawLauncherPick();
  if (mode !== MODE.ENTRY && mode !== MODE.SCORES) drawFloaters();
  if (mode !== MODE.MENU && mode !== MODE.HOWTO &&
      mode !== MODE.ENTRY && mode !== MODE.SCORES) drawHUD();

  if (mode === MODE.MENU) {
    drawMenu();
  } else if (mode === MODE.ENTRY) {
    drawEntry();
  } else if (mode === MODE.SCORES) {
    drawScores();
  } else if (mode === MODE.HOWTO) {
    drawCard('HOW TO PLAY', [
      'TAP THE SKY TO DETONATE FLAK',
      { text: 'CHAINED BLASTS MULTIPLY POINTS', col: PALETTE.tealDark },
      'A NEW LAUNCHER EVERY TENTH WAVE',
      { text: 'PICK ONE FAST — NOTHING PAUSES', col: PALETTE.red },
      'ITS AMMO IS ALL YOU GET',
      'SHIELDS BLOCK ONE SIDE ONLY',
      'HUNTERS EAT YOUR OWN ROUNDS',
      'DIG BURROWERS OUT BEFORE THE FUSE',
      { text: 'SURVIVE ALL ' + FINAL_WAVE + ' WAVES', col: PALETTE.gold }
    ], '— TAP TO RETURN —', PALETTE.teal);
  } else if (mode === MODE.PAUSED) {
    drawPauseScreen();
  } else if (mode === MODE.DEMO_END) {
    const g = drawCard('WAVE 1 CLEAR', [
      { text: 'THAT WAS ONE WAVE', col: PALETTE.red },
      'THERE ARE ' + FINAL_WAVE + ' OF THEM',
      { text: 'SEVEN LAUNCHERS TO CHOOSE', col: PALETTE.tealDark },
      { text: 'NINE THINGS COMING FOR YOU', col: PALETTE.tealDark },
      'SCORE  ' + score
    ], '', PALETTE.gold);
    const bw = Math.min(W * 0.5, 200);
    button((W - bw) / 2, g.cy + g.ch + 14, bw, 40, 'PLAY AGAIN',
      () => { resetGame(); restartLockUntil = performance.now() + 300; },
      { primary: true });
    ctx.font = '700 11px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = PALETTE.ink;
    ctx.fillText('THE FULL GAME IS COMING TO GOOGLE PLAY', W / 2, g.cy + g.ch + 74);
  } else if (mode === MODE.VICTORY) {
    drawCard('VICTORY', [
      { text: 'ALL ' + FINAL_WAVE + ' WAVES REPELLED', col: PALETTE.teal },
      'FINAL SCORE  ' + score,
      { text: 'CITIES STANDING  ' + cities.filter(c => c.alive).length + ' / 6',
        col: PALETTE.gold },
      'FLAK FIRED ' + shots + '  ·  KILLS ' + kills,
      { text: 'BEST CHAIN  ×' + bestChain, col: PALETTE.tealDark },
      { text: diff().name + '  ×' + diff().score, col: diff().col }
    ], '— TAP TO CONTINUE —', PALETTE.gold);
  } else if (mode === MODE.WAVE_END && waveBonus) {
    drawCard('WAVE ' + wave + ' CLEAR', [
      { text: 'CITY BONUS  +' + waveBonus.cities, col: PALETTE.teal },
      { text: 'FLAK BONUS  +' + waveBonus.ammo, col: PALETTE.gold }
    ], 'STAND BY…', PALETTE.teal);
  } else if (mode === MODE.GAME_OVER) {
    const g = drawCard('THE END?', [
      { text: 'ALL CITIES LOST', col: PALETTE.red },
      'FINAL SCORE  ' + score,
      { text: 'BEST  ' + highScore, col: PALETTE.gold },
      'REACHED WAVE  ' + wave,
      'FLAK FIRED ' + shots + '  ·  KILLS ' + kills,
      { text: 'BEST CHAIN  ×' + bestChain, col: PALETTE.tealDark },
      { text: diff().name + '  ×' + diff().score, col: diff().col }
    ], '— TAP TO RE-ARM —', PALETTE.red);
    const bw = 130, bgap = 12;
    const bx0 = (W - bw * 2 - bgap) / 2;
    button(bx0, g.cy + g.ch + 14, bw, 38, 'MENU', () => { mode = MODE.MENU; });
    button(bx0 + bw + bgap, g.cy + g.ch + 14, bw, 38, 'SCORES',
      () => { entryIdx = -1; mode = MODE.SCORES; });
  }

  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = `rgba(222,59,38,${flash * 0.25})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ------------------------------------------------------------------ */
/* Input                                                              */
/* ------------------------------------------------------------------ */
let restartLockUntil = 0;
cvs.addEventListener('pointerdown', (ev) => {
  audio(); // unlock on first gesture
  const rect = cvs.getBoundingClientRect();
  const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  // UI plates take priority in every mode
  for (const b of uiButtons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      b.action();
      // Fired AFTER the action so that the tap which switches haptics off is
      // itself silent, while switching them on still confirms itself.
      haptic('ui');
      return;
    }
  }
  if (mode === MODE.MENU || mode === MODE.PAUSED || mode === MODE.ENTRY) return;
  if (mode === MODE.HOWTO) { mode = MODE.MENU; return; }
  if (mode === MODE.SCORES) { mode = MODE.MENU; return; }
  if (mode === MODE.DEMO_END) {
    if (performance.now() > restartLockUntil) { resetGame(); }
    return;
  }
  if (mode === MODE.VICTORY) {
    if (qualifies(score)) { entryName = ''; mode = MODE.ENTRY; }
    else mode = MODE.MENU;
    return;
  }
  if (mode === MODE.GAME_OVER) {
    if (performance.now() > restartLockUntil) { resetGame(); }
    return;
  }
  if (performance.now() < restartLockUntil) return; // swallow the starting tap
  fireInterceptor(x, y);
});
window.addEventListener('keydown', (ev) => {
  // Initial entry takes the keyboard wholesale while it is up.
  if (mode === MODE.ENTRY) {
    if (ev.key === 'Backspace') { entryName = entryName.slice(0, -1); blip(300, 0.05, 'square', 0.05); }
    else if (ev.key === 'Enter') { if (entryName.length) commitEntry(); }
    else if (/^[a-zA-Z]$/.test(ev.key) && entryName.length < 3) {
      entryName += ev.key.toUpperCase(); blip(700, 0.05, 'square', 0.05);
    }
    ev.preventDefault();
    return;
  }
  if (ev.code === 'Space') {
    if (mode === MODE.MENU || mode === MODE.GAME_OVER) resetGame();
    else if (mode === MODE.PAUSED) mode = MODE.PLAYING;
    else if (mode === MODE.SCORES) mode = MODE.MENU;
  }
  if (ev.code === 'Escape' || ev.code === 'KeyP') {
    if (mode === MODE.PLAYING) mode = MODE.PAUSED;
    else if (mode === MODE.PAUSED) mode = MODE.PLAYING;
    else if (mode === MODE.HOWTO || mode === MODE.SCORES) mode = MODE.MENU;
  }
});
// Silence the synth while the app is backgrounded; rAF already halts the game.
document.addEventListener('visibilitychange', () => {
  if (document.hidden && mode === MODE.PLAYING) { hapticStop(); mode = MODE.PAUSED; }
  if (!AC) return;
  if (document.hidden) AC.suspend();
  else if (AC.state === 'suspended') AC.resume();
});
// Android back button (only present inside the Capacitor shell):
// steps back through the menu structure; exits only from the main menu.
if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
  window.Capacitor.Plugins.App.addListener('backButton', () => {
    if (mode === MODE.PLAYING) mode = MODE.PAUSED;
    // Never drop a qualifying score on the floor: back commits what's typed.
    else if (mode === MODE.ENTRY) commitEntry();
    else if (mode === MODE.PAUSED || mode === MODE.HOWTO ||
             mode === MODE.GAME_OVER || mode === MODE.SCORES) mode = MODE.MENU;
    else if (mode === MODE.MENU) window.Capacitor.Plugins.App.exitApp();
    // WAVE_END: ignore, it resolves itself in a couple of seconds
  });
}

/* ------------------------------------------------------------------ */
/* Main loop                                                          */
/* ------------------------------------------------------------------ */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  flushHaptics();   // one effect per frame, after collisions have settled
  render();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
